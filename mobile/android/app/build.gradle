apply plugin: 'com.android.application'

android {
    namespace "com.lantransfer.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lantransfer.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "1.1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// The private release key and its password live outside the repository. This
// per-machine file is gitignored and is created only on the signing workstation.
def localSigningConfig = rootProject.file('signing.local.properties')
if (localSigningConfig.exists()) {
    def signingProperties = new Properties()
    localSigningConfig.withInputStream { signingProperties.load(it) }
    def signingPasswordFile = file(signingProperties.getProperty('storePasswordFile'))
    if (!signingPasswordFile.isFile()) {
        throw new GradleException("Android signing password file is missing: ${signingPasswordFile}")
    }
    def signingPassword = signingPasswordFile.getText('UTF-8').trim()
    android.signingConfigs {
        release {
            storeFile file(signingProperties.getProperty('storeFile'))
            storeType 'PKCS12'
            storePassword signingPassword
            keyAlias signingProperties.getProperty('keyAlias')
            keyPassword signingPassword
        }
    }
    android.buildTypes.release.signingConfig android.signingConfigs.release
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion '1.8.22'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
